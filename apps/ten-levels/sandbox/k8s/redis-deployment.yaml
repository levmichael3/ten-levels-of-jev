apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: true
      containers:
        - name: redis
          image: redis:7.2.4
          securityContext:
            runAsUser: 999
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
              readOnly: true
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
