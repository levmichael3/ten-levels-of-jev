<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Level 6">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-m" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Lines: a straight line has a zero-height bounding box, which clips a bbox-relative filter
         to nothing. This one is measured in canvas units so horizontal and vertical lines keep their glow. -->
    <filter id="glow-line" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f935f8"/><stop offset="1" stop-color="#80ffe4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#b9a9c9"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#80ffe4"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#f935f8"/>
    </marker>
  </defs>
<rect x="130" y="320" width="300" height="260" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(128,255,228,0.32)" stroke-width="5"/>
    <rect x="180" y="370" width="200" height="34" rx="8" fill="rgba(185,169,201,0.35)"/>
    <rect x="180" y="430" width="170" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="180" y="470" width="200" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="180" y="510" width="140" height="28" rx="14" fill="rgba(185,169,201,0.35)"/>
    <path d="M430 450 H620" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="640" y="405" width="220" height="90" rx="14" fill="rgba(255,255,255,0.05)" stroke="#b9a9c9" stroke-width="5"/>
    <rect x="670" y="438" width="160" height="28" rx="14" fill="rgba(185,169,201,0.35)"/>
    <path d="M860 450 H960" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <polygon points="1190.0,450.0 1135.0,545.3 1025.0,545.3 970.0,450.0 1025.0,354.7 1135.0,354.7" fill="rgba(128,255,228,0.16)" stroke="#80ffe4" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M1190 450 H1260 V300 H1330" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1260 450 V600 H1330" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="1340" y="240" width="200" height="120" rx="18" fill="rgba(94,240,122,0.18)" stroke="#5ef07a" stroke-width="5"/>
    <rect x="1340" y="540" width="200" height="120" rx="18" fill="rgba(252,95,74,0.18)" stroke="#fc5f4a" stroke-width="5"/>
</svg>
