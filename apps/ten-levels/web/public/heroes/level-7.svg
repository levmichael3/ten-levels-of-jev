<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Level 7">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-m" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Lines: a straight line has a zero-height bounding box, which clips a bbox-relative filter
         to nothing. This one is measured in canvas units so horizontal and vertical lines keep their glow. -->
    <filter id="glow-line" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f935f8"/><stop offset="1" stop-color="#80ffe4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#b9a9c9"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#80ffe4"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#f935f8"/>
    </marker>
  </defs>
<circle cx="180" cy="450" r="26" fill="rgba(185,169,201,0.35)"/><circle cx="290" cy="450" r="26" fill="rgba(185,169,201,0.35)"/><circle cx="400" cy="450" r="26" fill="rgba(185,169,201,0.35)"/><circle cx="510" cy="450" r="26" fill="rgba(185,169,201,0.35)"/><circle cx="620" cy="450" r="26" fill="#80ffe4" filter="url(#glow)"/>
    <path d="M206 450 H654" fill="none" stroke="rgba(185,169,201,0.35)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M660 450 H760" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <g transform="translate(870 450) rotate(45)"><rect x="-90" y="-90" width="180" height="180" rx="18" fill="rgba(128,255,228,0.16)" stroke="#80ffe4" stroke-width="5" filter="url(#glow)"/></g>
    <path d="M990 450 H1060 V150 H1130" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1060 450 V350 H1130" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1060 450 V550 H1130" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1060 450 V750 H1130" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="1140" y="100" width="330" height="100" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(185,169,201,0.35)" stroke-width="5"/>
    <rect x="1140" y="300" width="330" height="100" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(128,255,228,0.32)" stroke-width="5"/>
    <rect x="1140" y="500" width="330" height="100" rx="18" fill="rgba(242,232,90,0.18)" stroke="#f2e85a" stroke-width="5"/>
    <rect x="1140" y="700" width="330" height="100" rx="18" fill="rgba(252,95,74,0.18)" stroke="#fc5f4a" stroke-width="5"/>
</svg>
