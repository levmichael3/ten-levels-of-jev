<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Level 10">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-m" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Lines: a straight line has a zero-height bounding box, which clips a bbox-relative filter
         to nothing. This one is measured in canvas units so horizontal and vertical lines keep their glow. -->
    <filter id="glow-line" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f935f8"/><stop offset="1" stop-color="#80ffe4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#b9a9c9"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#80ffe4"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#f935f8"/>
    </marker>
  </defs>
<rect x="130" y="250" width="340" height="400" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(128,255,228,0.32)" stroke-width="5"/>
    <rect x="180" y="300" width="240" height="34" rx="8" fill="rgba(185,169,201,0.35)"/>
    <rect x="180" y="360" width="260" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="180" y="404" width="200" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="180" y="448" width="240" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="180" y="492" width="180" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="180" y="536" width="220" height="28" rx="14" fill="rgba(185,169,201,0.35)"/>
    <path d="M470 450 H580" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M600 330 Q740 260 880 340 Q960 450 880 560 Q740 640 600 560 Q540 450 600 330 Z" fill="rgba(249,53,248,0.16)" stroke="#f935f8" stroke-width="5" filter="url(#glow-m)"/>
    <rect x="660" y="400" width="160" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="660" y="440" width="200" height="28" rx="14" fill="rgba(185,169,201,0.35)"/><rect x="660" y="480" width="140" height="28" rx="14" fill="rgba(185,169,201,0.35)"/>
    <path d="M960 450 H1060" fill="none" stroke="#b9a9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <g transform="translate(1180 450) rotate(45)"><rect x="-90" y="-90" width="180" height="180" rx="18" fill="rgba(128,255,228,0.16)" stroke="#80ffe4" stroke-width="5" filter="url(#glow)"/></g>
    <path d="M1180 570 V720 H300 V660" fill="none" stroke="#80ffe4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a)" stroke-dasharray="14 12"/>
    <rect x="1300" y="420" width="180" height="60" rx="30" fill="#80ffe4"/>
</svg>
